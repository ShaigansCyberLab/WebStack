
name: WebStack CI
# Diagnostic: verify push-triggered workflow execution.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test WebStack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Retrieve repository source code
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Validate Docker Compose configuration
      - name: Validate Compose configuration
        run: docker compose config --quiet

      # 3. Build PHP image first
      - name: Build PHP image
        run: docker build -t webstack-php:dev -f docker/php/Dockerfile .

      # 4. Build Nginx image second
      - name: Build Nginx image
        run: docker build -t webstack-nginx:dev -f docker/nginx/Dockerfile .

      # 5. Start application containers
      - name: Start WebStack
        run: docker compose up -d --no-build

      # 6. Validate PHP syntax inside the PHP container
      - name: PHP syntax validation
        run: |
          docker compose exec -T php sh -c '
            files=$(find /var/www/html -type f -name "*.php")

            if [ -z "$files" ]; then
              echo "ERROR: No PHP files found!"
              exit 1
            fi

            find /var/www/html -type f -name "*.php" -print0 |
              xargs -0 -r -n1 php -l
          '

      # 7. Test HTTP response through Nginx
      - name: HTTP integration test
        run: |
          response_metadata=""

          # Wait for the application to become available
          for attempt in $(seq 1 20); do
            if response_metadata=$(curl -fsS \
              -o /tmp/webstack-response.html \
              -w '%{http_code}\n%{content_type}' \
              http://127.0.0.1:8080/); then
              break
            fi

            echo "Waiting for WebStack... attempt $attempt"
            sleep 2
          done

          # Ensure we received a response
          if [ -z "$response_metadata" ]; then
            echo "ERROR: WebStack did not respond!"
            exit 1
          fi

          # Extract HTTP metadata
          http_status=$(printf '%s\n' "$response_metadata" | sed -n '1p')
          content_type=$(printf '%s\n' "$response_metadata" | sed -n '2p')

          # Verify HTTP status
          if [ "$http_status" != "200" ]; then
            echo "ERROR: Expected HTTP 200, received $http_status"
            exit 1
          fi

          # Verify Content-Type
          if [ "$content_type" != "text/html; charset=utf-8" ]; then
            echo "ERROR: Unexpected Content-Type: $content_type"
            exit 1
          fi

          # Verify application content
          grep -Fq '<title>WebStack</title>' /tmp/webstack-response.html
          grep -Fq '<h1>WebStack</h1>' /tmp/webstack-response.html
          grep -Fq 'PHP application is running.' /tmp/webstack-response.html

          # Verify PHP version format
          grep -Eq 'PHP version: [0-9]+\.[0-9]+\.[0-9]+' /tmp/webstack-response.html

          echo "All HTTP integration assertions passed!"




      # 8. Scan PHP image for vulnerabilities
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: webstack-php:dev
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          format: table
          exit-code: '1'
      # 9. Display logs if something fails
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      # 10. Clean up containers
      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans || true

