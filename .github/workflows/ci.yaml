
name: WebStack CI
# Diagnostic: verify push-triggered workflow execution.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and Test WebStack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Retrieve repository source code
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Validate Docker Compose configuration
      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build WebStack images
        run: docker compose build

      # 5. Start application containers
      - name: Start WebStack
        run: docker compose up -d 

      # 6. Validate PHP syntax inside the PHP container
      - name: PHP syntax validation
        run: |
          docker compose exec -T php sh -c '
            files=$(find /var/www/html -type f -name "*.php")

            if [ -z "$files" ]; then
              echo "ERROR: No PHP files found!"
              exit 1
            fi

            find /var/www/html -type f -name "*.php" -print0 |
              xargs -0 -r -n1 php -l
          '

      # 7. Test HTTP response through Nginx
      
      - name: HTTP integration test
        run: |
          response_metadata=""

          # Wait for the health endpoint to become available
          for attempt in $(seq 1 20); do
            if response_metadata=$(curl -fsS \
              -o /tmp/webstack-health.json \
              -w '%{http_code}\n%{content_type}' \
              http://127.0.0.1:8080/health); then
              break
            fi

            echo "Waiting for WebStack health endpoint... attempt $attempt"
            sleep 2
          done

          # Ensure we received a response
          if [ -z "$response_metadata" ]; then
            echo "ERROR: WebStack health endpoint did not respond!"
            exit 1
          fi

          # Extract HTTP metadata
          http_status=$(printf '%s\n' "$response_metadata" | sed -n '1p')
          content_type=$(printf '%s\n' "$response_metadata" | sed -n '2p')

          # Verify HTTP status
          if [ "$http_status" != "200" ]; then
            echo "ERROR: Expected HTTP 200, received $http_status"
            exit 1
          fi

          # Verify Content-Type
          if [ "$content_type" != "application/json; charset=utf-8" ]; then
            echo "ERROR: Unexpected Content-Type: $content_type"
            exit 1
          fi

          # Verify valid JSON
          if ! jq -e . /tmp/webstack-health.json > /dev/null; then
            echo "ERROR: Health endpoint returned invalid JSON!"
            exit 1
          fi

          # Verify application health status
          if [ "$(jq -r '.status' /tmp/webstack-health.json)" != "ok" ]; then
            echo "ERROR: Application health status is not OK!"
            cat /tmp/webstack-health.json
            exit 1
          fi

          # Verify application identity
          if [ "$(jq -r '.application' /tmp/webstack-health.json)" != "WebStack" ]; then
            echo "ERROR: Unexpected application identity!"
            cat /tmp/webstack-health.json
            exit 1
          fi

          echo "All HTTP integration assertions passed!"




      # 8. Scan PHP image for vulnerabilities
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/shaiganscyberlab/webstack-php:latest
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          format: table
          exit-code: '0'

          
      # 9. Authenticate with GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # 10. Tag and push images to GitHub Container Registry
      - name: Tag and push images to GHCR
        env:
          REGISTRY: ghcr.io
          IMAGE_OWNER: shaiganscyberlab
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "$REGISTRY/$IMAGE_OWNER/webstack-php:latest" "$REGISTRY/$IMAGE_OWNER/webstack-php:$IMAGE_TAG"
          docker tag "$REGISTRY/$IMAGE_OWNER/webstack-nginx:latest" "$REGISTRY/$IMAGE_OWNER/webstack-nginx:$IMAGE_TAG"

          docker push "$REGISTRY/$IMAGE_OWNER/webstack-php:$IMAGE_TAG"
          docker push "$REGISTRY/$IMAGE_OWNER/webstack-php:latest"

          docker push "$REGISTRY/$IMAGE_OWNER/webstack-nginx:$IMAGE_TAG"
          docker push "$REGISTRY/$IMAGE_OWNER/webstack-nginx:latest"
