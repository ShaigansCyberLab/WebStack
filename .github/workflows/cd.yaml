name: WebStack CD

on:
  workflow_run:
    workflows: ["WebStack CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy WebStack
    runs-on: [self-hosted, webstack-deploy]

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout successful CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Prepare deployment directory
        run: |
          mkdir -p /opt/webstack
          cp compose.yaml /opt/webstack/compose.yaml

      - name: Pull Docker images
        run: docker compose -p webstack -f /opt/webstack/compose.yaml pull

      - name: Deploy WebStack
        run: docker compose -p webstack -f /opt/webstack/compose.yaml up -d

      - name: Verify WebStack
        run: |
          echo "Checking WebStack HTTP response..."
          curl --fail --silent --show-error http://127.0.0.1:8080/
          echo ""
          echo "WebStack deployment successful!"