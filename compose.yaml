services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: ghcr.io/shaiganscyberlab/webstack-php:${IMAGE_TAG:-latest}
    container_name: php
    networks:
      - webstack-network
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: ghcr.io/shaiganscyberlab/webstack-nginx:${IMAGE_TAG:-latest}
    container_name: nginx
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - php
    networks:
      - webstack-network
    restart: unless-stopped

networks:
  webstack-network:
    name: webstack-network
    driver: bridge